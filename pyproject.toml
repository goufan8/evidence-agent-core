[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-agent-core"
version = "0.1.0"
description = "A local-first change-control layer for durable AI agent learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evidence Agent Core contributors" }]
keywords = ["ai-agents", "memory", "governance", "evaluation", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
evidence-agent-core = "evidence_agent_core.cli:main"

[project.urls]
Homepage = "https://github.com/goufan8/evidence-agent-core"
Issues = "https://github.com/goufan8/evidence-agent-core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
