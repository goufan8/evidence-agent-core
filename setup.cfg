[metadata]
name = evidence-agent-core
version = 0.4.0
description = Local-first coordination and change control for durable AI agent work.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    evidence-agent-core = evidence_agent_core.cli:main
