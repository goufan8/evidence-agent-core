[metadata]
name = evidence-agent-core
version = 0.1.0
description = A local-first change-control layer for durable AI agent learning.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    evidence-agent-core = evidence_agent_core.cli:main
